name: Collect reel stats

# Every day, saves Instagram insights for each posted reel to engine/data/reel-stats.json (one snapshot a day for
# its first 30 days). reels_generator's reel-learnings.yml reads that file an hour later and updates the learnings.
# Pull requests that touch the collector run it as a dry run (nothing saved).
on:
  schedule:
    - cron: "17 12 * * *"
  pull_request:
    paths: ["engine/reelstats.py", ".github/workflows/reel-stats.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: reel-stats

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extend a short-lived token to 60 days and save it
        if: github.event_name != 'pull_request'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          case "$IG_ACCESS_TOKEN" in EAA*) ;; *) exit 0;; esac
          [ -n "$META_APP_SECRET" ] || exit 0
          NEW=$(python3 engine/instagram.py refresh) || { echo "Could not extend the token."; exit 0; }
          echo "::add-mask::$NEW"
          echo "IG_ACCESS_TOKEN=$NEW" >> "$GITHUB_ENV"
          printf '%s' "$NEW" | gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" || echo "::warning::Couldn't save the 60-day token."
      - name: Collect
        env:
          IG_ACCESS_TOKEN: ${{ env.IG_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "IG_ACCESS_TOKEN is not set."; exit 1; fi
          set -o pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then python3 engine/reelstats.py collect --dry
          else python3 engine/reelstats.py collect; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect @5beforemonday (chips)
        continue-on-error: true  # a problem with the chips account never blocks @fivebeforemonday
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_USERNAME: 5beforemonday
          IG_QUEUE: reels-chips
          IG_STATS: reel-stats-chips.json
          IG_USER_ID_FALLBACK: ${{ vars.IG_USER_ID_2 }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "IG_ACCESS_TOKEN_2 is not set; skipping @5beforemonday."; exit 0; fi
          mkdir -p reels-chips
          set -o pipefail
          python3 engine/instagram.py check | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = pull_request ]; then python3 engine/reelstats.py collect --dry
          else python3 engine/reelstats.py collect; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "five-before-monday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engine/data/reel-stats.json engine/data/reel-stats-chips.json 2>/dev/null || git add engine/data/reel-stats.json
          git diff --cached --quiet || (git commit -m "Reel stats $(date -u +%F)" && git pull --rebase && git push)
