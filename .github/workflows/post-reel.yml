name: Post reel to Instagram

# The daily reel task pushes reels/<date>.mp4 + reels/<date>.json after the New York close.
# This posts every queued reel at about 6:31pm New York time (23:31 UTC in winter, 22:31 UTC in summer),
# and refreshes the Instagram token every Sunday so it never expires.
on:
  schedule:
    # GitHub drops or delays scheduled runs under load (none fired on Nov 16), so try every 30 minutes through the
    # New York evening; any run from 6pm to midnight New York posts whatever is still queued (posting is idempotent).
    - cron: "1,31 22,23 * * 1-5"
    - cron: "1,31 0-3 * * 2-6"
    - cron: "11 4 * * 0" # Sunday: refresh the Instagram token
  workflow_dispatch:
    inputs:
      now:
        description: "Post queued reels now, whatever the time"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency: post-reel

jobs:
  post:
    if: github.event.schedule != '11 4 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Is it 6pm in New York?
        id: when
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" -ge 18 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'true'
      - name: Extend a short-lived token to 60 days and save it
        if: steps.when.outputs.go == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          case "$IG_ACCESS_TOKEN" in EAA*) ;; *) exit 0;; esac
          if [ -z "$META_APP_SECRET" ]; then echo "Can't extend the token (META_APP_SECRET missing)."; exit 0; fi
          NEW=$(python3 engine/instagram.py refresh) || { echo "Could not extend the token; posting with the current one."; exit 0; }
          echo "::add-mask::$NEW"
          echo "IG_ACCESS_TOKEN=$NEW" >> "$GITHUB_ENV"
          # Saving the 60-day token needs SECRETS_PAT (fine-grained, Secrets: read and write on this repo).
          printf '%s' "$NEW" | gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" \
            || echo "::warning::Couldn't save the 60-day token: SECRETS_PAT is missing, expired or lacks Secrets read/write. Posting anyway."
      - name: Post queued reels
        if: steps.when.outputs.go == 'true'
        id: post
        env:
          IG_ACCESS_TOKEN: ${{ env.IG_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] && [ -z "$MAKE_WEBHOOK_URL" ]; then echo "Neither IG_ACCESS_TOKEN nor MAKE_WEBHOOK_URL is set; nothing posted."; exit 0; fi
          if [ -n "$IG_ACCESS_TOKEN" ]; then python3 engine/instagram.py check | tee -a "$GITHUB_STEP_SUMMARY"; fi
          python3 engine/instagram.py post
      - name: Post queued reels for @5beforemonday (chips)
        continue-on-error: true  # a problem with the chips account never blocks @fivebeforemonday
        if: steps.when.outputs.go == 'true' && always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_USERNAME: 5beforemonday
          IG_QUEUE: reels-chips
          IG_USER_ID_FALLBACK: ${{ vars.IG_USER_ID_2 }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "IG_ACCESS_TOKEN_2 is not set; skipping @5beforemonday."; exit 0; fi
          ls reels-chips/*.json >/dev/null 2>&1 || { echo "Nothing queued for @5beforemonday."; exit 0; }
          case "$IG_ACCESS_TOKEN" in EAA*)
            if NEW=$(python3 engine/instagram.py refresh 2>/dev/null); then
              echo "::add-mask::$NEW"; export IG_ACCESS_TOKEN="$NEW"
              printf '%s' "$NEW" | gh secret set IG_ACCESS_TOKEN_2 --repo "${{ github.repository }}" || echo "::warning::Couldn't save the 60-day token 2."
            fi;;
          esac
          python3 engine/instagram.py check | tee -a "$GITHUB_STEP_SUMMARY"
          python3 engine/instagram.py post
      - name: Record what was posted
        if: steps.when.outputs.go == 'true' && always()
        run: |
          git config user.name "five-before-monday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A reels reels-chips 2>/dev/null || git add -A reels
          git diff --cached --quiet || (git commit -m "Posted reels $(date -u +%F)" && git pull --rebase && git push)
      - name: Report a failure
        if: failure() && steps.when.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Reel not posted $(date -u +%F)" \
            --body "The Instagram post failed. See the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  refresh-token:
    if: github.event.schedule == '11 4 * * 0' && vars.IG_REFRESH != 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the Instagram token and save it
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "No Instagram token (posting via Make); nothing to refresh."; exit 0; fi
          NEW=$(python3 engine/instagram.py refresh)
          echo "::add-mask::$NEW"
          printf '%s' "$NEW" | gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}"
          echo "Token refreshed."
      - name: Refresh the @5beforemonday token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "No IG_ACCESS_TOKEN_2; nothing to refresh."; exit 0; fi
          NEW=$(python3 engine/instagram.py refresh)
          echo "::add-mask::$NEW"
          printf '%s' "$NEW" | gh secret set IG_ACCESS_TOKEN_2 --repo "${{ github.repository }}"
          echo "Token 2 refreshed."
